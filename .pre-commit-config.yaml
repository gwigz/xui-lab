repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.8
    hooks:
      - id: clang-format
        args: [--dry-run, --Werror]
        files: ^adapters/.*\.(c|cc|cpp|cxx|h|hh|hpp)$
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
