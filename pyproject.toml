[tool.ruff]
required-version = "==0.16.5"
target-version = "py310"
line-length = 88
preview = false
unsafe-fixes = false
include = ["*.py", "*.pyi", "xui-lab"]
exclude = [
    ".git",
    ".ruff_cache",
    ".venv",
    "artifacts",
    "build",
    "build-*",
    "generated",
    "viewers",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
fixable = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
