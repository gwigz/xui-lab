[tool.mypy]
files = ["xui_lab", "xui-lab"]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
norecursedirs = [".hypothesis", "scenarios"]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["xui_lab"]

[tool.coverage.report]
fail_under = 59
show_missing = true

[tool.ruff]
required-version = "==0.16.5"
target-version = "py310"
line-length = 88
preview = false
unsafe-fixes = false
include = ["*.py", "*.pyi", "xui-lab"]
exclude = [
    ".git",
    ".ruff_cache",
    ".venv",
    "artifacts",
    "build",
    "build-*",
    "generated",
    "viewers",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
fixable = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
