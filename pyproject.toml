[project]
name = "xui-lab"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.141.1",
    "jq==1.12.0",
    "platformdirs==4.5.0",
    "pydantic==2.13.5",
    "uvicorn==0.52.4",
]

[dependency-groups]
dev = [
    "check-jsonschema==0.38.0",
    "clang-format==22.1.8",
    "clang-tidy==22.1.8",
    "coverage==7.16.0",
    "httpx==0.28.1",
    "hypothesis==6.167.1",
    "mypy==2.3.1",
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "ruff==0.16.5",
]

[tool.uv]
package = false
required-version = "==0.12.9"

[tool.mypy]
files = ["xui_lab", "xui-lab"]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
norecursedirs = [".hypothesis", "scenarios"]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["xui_lab"]

[tool.coverage.report]
fail_under = 59
show_missing = true

[tool.ruff]
required-version = "==0.16.5"
target-version = "py310"
line-length = 88
preview = false
unsafe-fixes = false
include = ["*.py", "*.pyi", "xui-lab"]
exclude = [
    ".git",
    ".ruff_cache",
    ".venv",
    "artifacts",
    "build",
    "build-*",
    "generated",
    "viewers",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
fixable = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
