name: Python

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
      - name: Install developer tools
        run: python -m pip install --requirement requirements-dev.txt
      - name: Lint Python
        run: ruff check .
      - name: Check Python formatting
        run: ruff format --check .
      - name: Check Python types
        run: mypy
      - name: Check C++ formatting
        run: ./xui-lab cpp format --check
      - name: Validate JSON schemas and instances
        run: ./scripts/check-schemas
      - name: Check repository
        run: ./xui-lab check
      - name: Run Python tests with branch coverage
        run: coverage run -m pytest
      - name: Enforce the coverage floor
        run: coverage report
