name: Python

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.9"
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint Python
        run: uv run --locked ruff check .
      - name: Check Python formatting
        run: uv run --locked ruff format --check .
      - name: Check Python types
        run: uv run --locked mypy
      - name: Check C++ formatting
        run: uv run --locked ./xui-lab cpp format --check
      - name: Validate JSON schemas and instances
        run: uv run --locked ./scripts/check-schemas
      - name: Check repository
        run: uv run --locked ./xui-lab check
      - name: Run Python tests with branch coverage
        run: uv run --locked coverage run -m pytest
      - name: Enforce the coverage floor
        run: uv run --locked coverage report
